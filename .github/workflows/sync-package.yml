name: Build VPM Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Packages/com.nekoneko.nn-rainbow-tool/**"
      - ".github/workflows/sync-package.yml"

permissions:
  contents: write

concurrency:
  group: vpm-package
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate package manifest
        run: python -m json.tool Packages/com.nekoneko.nn-rainbow-tool/package.json > /dev/null

      - name: Build VPM package ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Releases
          ZIP="$GITHUB_WORKSPACE/Releases/com.nekoneko.nn-rainbow-tool-1.0.0.zip"
          rm -f "$ZIP"
          cd Packages/com.nekoneko.nn-rainbow-tool
          zip -qr "$ZIP" .
          unzip -t "$ZIP"

      - name: Update listing checksum
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum Releases/com.nekoneko.nn-rainbow-tool-1.0.0.zip | awk '{print $1}')"
          python - "$SHA" <<'PY'
          import json, sys
          sha = sys.argv[1]
          for path in ("Website/index.json", "index.json"):
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              data["packages"]["com.nekoneko.nn-rainbow-tool"]["versions"]["1.0.0"]["zipSHA256"] = sha
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, separators=(",", ":"))
                  f.write("\n")
          PY

      - name: Commit generated VPM files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Releases/com.nekoneko.nn-rainbow-tool-1.0.0.zip Website/index.json index.json
          git rm -f --ignore-unmatch Releases/jp.nekoneko.nn-rainbow-tool-1.0.0.zip
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build VPM package 1.0.0"
          git push
