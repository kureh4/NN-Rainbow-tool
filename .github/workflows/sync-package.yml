name: Build VPM Package

on:
  push:
    branches: [main]
    paths:
      - "Packages/jp.nekoneko.nn-rainbow-tool/**"
      - ".github/workflows/sync-package.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package manifest
        run: python -m json.tool Packages/jp.nekoneko.nn-rainbow-tool/package.json > /dev/null

      - name: Build VPM package ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Releases
          ZIP="$GITHUB_WORKSPACE/Releases/jp.nekoneko.nn-rainbow-tool-1.0.0.zip"
          rm -f "$ZIP"
          cd Packages/jp.nekoneko.nn-rainbow-tool
          zip -qr "$ZIP" .
          unzip -t "$ZIP"

      - name: Update listing checksum
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum Releases/jp.nekoneko.nn-rainbow-tool-1.0.0.zip | awk '{print $1}')"
          python - "$SHA" <<'PY'
          import json, sys
          path = "index.json"
          sha = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          data["packages"]["jp.nekoneko.nn-rainbow-tool"]["versions"]["1.0.0"]["zipSHA256"] = sha
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit generated VPM files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Releases/jp.nekoneko.nn-rainbow-tool-1.0.0.zip index.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build VPM package 1.0.0"
          git push
