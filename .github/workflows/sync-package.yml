name: Sync VPM Package Source

on:
  push:
    branches: [main]
    paths:
      - "Releases/jp.nekoneko.nn-rainbow-tool-*.zip"
      - ".github/workflows/sync-package.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract VPM package
        shell: bash
        run: |
          set -e
          PACKAGE_DIR="Packages/jp.nekoneko.nn-rainbow-tool"
          ZIP="Releases/jp.nekoneko.nn-rainbow-tool-1.0.0.zip"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          unzip -q "$ZIP" -d "$PACKAGE_DIR"
      - name: Commit synced package source
        shell: bash
        run: |
          if git diff --quiet -- Packages/jp.nekoneko.nn-rainbow-tool && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages/jp.nekoneko.nn-rainbow-tool
          git commit -m "Sync VPM package source"
          git push
