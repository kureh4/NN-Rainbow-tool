<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>NN - Rainbow tool</title>
  <style>
    html,body{
      margin:0;
      min-height:100%;
      background:#fff;
      color:#000;
    }
    body{
      font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Meiryo",sans-serif;
      display:flex;
      justify-content:center;
    }
    main{
      width:100%;
      max-width:900px;
      text-align:center;
      padding:32px 24px 40px;
    }
    h1{
      margin:0 0 28px;
      font-size:32px;
      line-height:1.3;
      font-weight:600;
    }
    .description{
      margin:0 0 38px;
      font-size:16px;
      line-height:1.7;
    }
    .button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:120px;
      height:56px;
      padding:0 20px;
      border:1.5px solid #1f2cff;
      border-radius:11px;
      color:#101cff;
      background:#fff;
      text-decoration:none;
      font-size:17px;
      font-weight:500;
      box-sizing:border-box;
    }
    .note{
      margin:40px 0 0;
      font-size:16px;
      line-height:1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>NN - Rainbow tool</h1>
    <p class="description">VRChat Creator Companion にVPMリポジトリを追加します。</p>
    <a class="button" href="vcc://vpm/addRepo?url=https%3A%2F%2Fkureh4.github.io%2FNN-Rainbow-tool%2Findex.json">VCCに追加</a>
    <p class="note">自動で開かない場合は、上のボタンを押してください。</p>
  </main>

  <script>
    setTimeout(() => {
      window.location.href = "vcc://vpm/addRepo?url=https%3A%2F%2Fkureh4.github.io%2FNN-Rainbow-tool%2Findex.json";
    }, 400);
  </script>
</body>
</html>
